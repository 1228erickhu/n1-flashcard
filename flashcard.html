<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>N1 單字卡</title>
    <style>
        body {
            background-color: #f5f0e8;
            font-family: sans-serif;
        }

        h1 {
            color: #c0392b;
        }

        h2 {
            color: #352bc0;
        }

        img {
            border-radius: 50%;
        }

        .intro {
            font-size: 28px;
        }

        .card {
            background-color: white;
            max-width: 600px;
            margin: 40px auto;
            padding: 32px;
            border-radius: 16px;
        }

        .btn {
            display: inline-block;
            background-color: #c0392b;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.3s;
            font-family: inherit;
            border: none;

        }

        @media(hover: hover) {
            .btn:hover{
            background-color: #352bc0;
            transform: scale(1.1);
            }
        }

        .card {
            text-align: center;
        }

        #word {
            font-size: 64px;
            color: #c0392b;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1 id="word">スタート</h1>
        <p id="meaning"></p>
        <button id="next-btn" class="btn">下一個</button>
        <button id="show-btn" class="btn">看讀音</button>
    </div>
    <script>
        const words = [
            "あ", "い", "う", "え", "お",
            "か", "き", "く", "け", "こ",
            "さ", "し", "す", "せ", "そ",
            "た", "ち", "つ", "て", "と",
            "な", "に", "ぬ", "ね", "の",
            "は", "ひ", "ふ", "へ", "ほ",
            "ま", "み", "む", "め", "も",
            "や", "ゆ", "よ",
            "ら", "り", "る", "れ", "ろ",
            "わ", "を", "ん"
        ];
        const meanings = [
            "a", "i", "u", "e", "o",
            "ka", "ki", "ku", "ke", "ko",
            "sa", "shi", "su", "se", "so",
            "ta", "chi", "tsu", "te", "to",
            "na", "ni", "nu", "ne", "no",
            "ha", "hi", "fu", "he", "ho",
            "ma", "mi", "mu", "me", "mo",
            "ya", "yu", "yo",
            "ra", "ri", "ru", "re", "ro",
            "wa", "wo", "n"
        ];
        const wordText = document.getElementById("word");
        const meaningText = document.getElementById("meaning");
        let current = 0;

        document.getElementById("next-btn").addEventListener("click", function () {
            current = Math.floor(Math.random() * words.length);
            wordText.textContent = words[current];
            meaningText.textContent = "";
        });

        document.getElementById("show-btn").addEventListener("click", function () {
            meaningText.textContent = meanings[current]
        });
    </script>
</body>

</html>
